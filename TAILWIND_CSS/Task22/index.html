<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - AI Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800">


    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-white border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-3">
            <div class="flex items-center justify-between">


                <!-- Logo -->
                <div class="font-bold text-sm text-gray-900">
                    ✦ Project
                </div>


                <!-- Navigation links -->
                <div class="hidden md:flex items-center gap-6">

                    <a href="#" class="text-xs text-gray-500 hover:text-gray-900">
                        Product
                    </a>

                    <a href="#" class="text-xs text-gray-500 hover:text-gray-900">
                        Solutions
                    </a>

                    <a href="#" class="text-xs text-gray-500 hover:text-gray-900">
                        Resources
                    </a>

                    <a href="#" class="text-xs text-gray-500 hover:text-gray-900">
                        Pricing
                    </a>

                    <a href="#" class="text-xs font-semibold text-gray-800">
                        Log in
                    </a>

                    <!-- Navbar CTA -->
                    <button
                        class="bg-gray-900 text-white text-xs px-4 py-2 hover:bg-gray-700">
                        Get AI free
                    </button>
                </div>
            </div>
        </div>
    </nav>



    <!-- HERO SECTION -->
    <section
        class="min-h-screen bg-gradient-to-b from-orange-50 via-white to-white px-6 pt-10 pb-20">
        <div class="max-w-4xl mx-auto text-center">
            <h1
                class="text-4xl md:text-5xl font-bold leading-tight text-gray-900">
                Write, plan, share.
                <br>

                <span class="text-gray-900">
                    With AI at your side.
                </span>
            </h1>


            <!-- Description -->
            <p
                class="mt-5 max-w-xl mx-auto text-sm md:text-base text-gray-500 leading-relaxed">
                It is the connected workspace where better, faster work happens.
                Now with AI.
            </p>



            <!-- CTA BUTTONS -->
            <div class="relative mt-6 flex justify-center gap-2">
                <!-- First button -->
                <button
                    class="bg-gray-900 text-white text-xs md:text-sm px-5 py-3 hover:bg-gray-700">
                    Get AI free →
                </button>


                <!-- Second button -->
                <button
                    class="relative bg-blue-600 text-white text-xs md:text-sm px-5 py-3 hover:bg-blue-700">
                    Request a demo
                </button>
            </div>
        </div>



        <!-- DASHBOARD / IMAGE AREA -->
        <div class="relative max-w-5xl mx-auto mt-10 h-[430px] md:h-[460px]">
            <div
                class="absolute left-1/2 top-5 -translate-x-1/2 w-[300px] md:w-[430px] z-10">
                <img
                    src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=900&q=80"
                    alt="Project workspace"
                    class="w-full h-[210px] md:h-[280px] object-cover shadow-lg">
            </div>



            <!-- TASKS CARD -->
            <div class="absolute left-0 md:left-10 top-16 bg-white p-4 shadow-lg w-44 z-20">


                <!-- Card heading -->
                <div class="flex items-center gap-2">
                    <span class="text-sm">
                        📝
                    </span>
                    <p class="text-xs font-semibold text-gray-700">
                        Tasks
                    </p>
                </div>


                <!-- Card description -->
                <p class="text-[10px] text-gray-400 mt-2">
                    12 tasks completed today
                </p>
            </div>



            <!-- PROJECT STATUS CARD -->

            <div
                class="absolute right-0 md:right-10 top-12 bg-white p-4 shadow-lg w-44 z-20">
                <div class="flex items-center gap-2">

                    <!-- Small green icon -->
                    <div
                        class="w-4 h-4 bg-green-100 text-green-600 flex items-center justify-center text-[10px]">
                        ✓
                    </div>


                    <p class="text-xs font-semibold text-gray-700">
                        Project Status
                    </p>
                </div>


                <!-- Status -->
                <p class="text-[10px] text-green-600 font-semibold mt-2">
                    On Track
                </p>

            </div>



            <!-- TEAM ACTIVITY CARD -->

            <div
                class="absolute right-5 md:right-24 bottom-16 bg-white p-3 shadow-lg w-48 z-20">

                <p class="text-[10px] font-semibold text-gray-700 mb-2">
                    Team Activity
                </p>

                <div class="flex items-center">


                    <!-- User image 1 -->
                    <img
                        src="https://i.pravatar.cc/40?img=1"
                        alt="Team member"
                        class="w-6 h-6 rounded-full border-2 border-white">


                    <!-- User image 2 -->
                    <img
                        src="https://i.pravatar.cc/40?img=2"
                        alt="Team member"
                        class="w-6 h-6 rounded-full border-2 border-white -ml-2">


                    <!-- User image 3 -->
                    <img
                        src="https://i.pravatar.cc/40?img=3"
                        alt="Team member"
                        class="w-6 h-6 rounded-full border-2 border-white -ml-2">


                    <!-- Online text -->
                    <span class="text-[10px] text-gray-400 ml-2">
                        +5 online
                    </span>
                </div>
            </div>
        </div>
    </section>

    <button
        class="fixed bottom-6 right-6 z-50 w-12 h-12 bg-gray-900 text-white shadow-lg flex items-center justify-center hover:bg-gray-700">
        💬
    </button>

</body>
</html>
